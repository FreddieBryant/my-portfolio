<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form Component</title>
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="https://kit.fontawesome.com/053ba03e61.js" crossorigin="anonymous"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <section id="contact" class="contact-section">
      <h2>Contact Me</h2>
      <form class="form" id="contact-form" action="https://formspree.io" method="POST">
        <div class="form__group">
          <label class="form__label" for="name">Name</label>
          <input
            class="form__input"
            id="name"
            name="name"
            type="text"
            placeholder="Your Name"
            required
          />
        </div>

        <div class="form__group">
          <label class="form__label" for="email">Email</label>
          <input
            class="form__input"
            id="email"
            name="email"
            type="email"
            placeholder="email@example.com"
            required
          />
        </div>

        <div class="form__group">
          <label class="form__label" for="course-select">Interested Course</label>
          <select class="form__select" id="course-select" name="interested_course">
            <optgroup label="Front-end Courses">
              <option value="html" selected>HTML</option>
              <option value="css">CSS</option>
              <option value="javascript">JavaScript</option>
            </optgroup>
            <optgroup label="Back-end Courses">
              <option value="node">Node.js</option>
              <option value="express">Express</option>
              <option value="mongodb">MongoDB</option>
            </optgroup>
          </select>
        </div>

        <fieldset class="form__group form__fieldset">
          <legend class="form__legend">Project Type</legend>
          <div class="form__radio-group">
            <!-- Added explicit matching id/for connections -->
            <input
              class="form__radio"
              type="radio"
              id="type-freelance"
              name="project_type"
              value="freelance"
              checked
            />
            <label for="type-freelance" class="form__inline-label">Freelance Contract</label>

            <input
              class="form__radio"
              type="radio"
              id="type-fulltime"
              name="project_type"
              value="fulltime"
            />
            <label for="type-fulltime" class="form__inline-label">Full-Time Hire</label>
          </div>
        </fieldset>

        <fieldset class="form__group form__fieldset">
          <legend class="form__legend">Services Needed</legend>
          <div class="form__checkbox-group">
            <!-- Added explicit matching id/for connections -->
            <input
              class="form__checkbox"
              type="checkbox"
              id="service-frontend"
              name="services"
              value="frontend"
            />
            <label for="service-frontend" class="form__inline-label">Frontend (React)</label>

            <input
              class="form__checkbox"
              type="checkbox"
              id="service-backend"
              name="services"
              value="backend"
            />
            <label for="service-backend" class="form__inline-label">Backend (Node/Mongo)</label>
          </div>
        </fieldset>

        <div class="form__group">
          <label class="form__label" for="timeline">Expected Timeline (Weeks)</label>
          <input
            class="form__slider"
            type="range"
            id="timeline"
            name="timeline"
            min="2"
            max="12"
            step="2"
            value="4"
          />
        </div>

        <div class="form__group">
          <label class="form__label" for="message">Message</label>
          <textarea
            class="form__textarea"
            id="message"
            name="message"
            rows="10"
            placeholder="Type your message here..."
            required
          ></textarea>
        </div>

        <button class="form__btn" type="submit">Send Message</button>
      </form>

      <div id="form-status" class="form__success-message">
        <i class="fa-solid fa-circle-check"></i> Message sent successfully!
      </div>
    </section>
  </body>
</html>
